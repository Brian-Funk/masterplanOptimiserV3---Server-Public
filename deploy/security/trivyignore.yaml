vulnerabilities:
  - id: CVE-2026-69247
    purls:
      - pkg:pypi/cryptography@49.0.0
    expired_at: 2026-08-18
    statement: >-
      The affected PKCS#7 EnvelopedData decrypt APIs are not used by MP-OPT.
      cryptography 50.0.0 is published, but WebAuthn's pyOpenSSL 26.3.0
      dependency currently requires cryptography<50. Remove this exception as
      soon as a compatible pyOpenSSL release permits the fixed lock.
