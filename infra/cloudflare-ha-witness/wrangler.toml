name = "mp-opt-ha-witness"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[[durable_objects.bindings]]
name = "CLUSTERS"
class_name = "ClusterLease"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClusterLease"]

[vars]
LEASE_TTL_SECONDS = "60"
WRITE_PERMIT_SECONDS = "10"

