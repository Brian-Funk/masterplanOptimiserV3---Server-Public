version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
updates:
  - package-ecosystem: pip
    directory: /backend
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: npm
    directory: /web
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: npm
    directory: /infra/cloudflare-ha-witness
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: docker
    directory: /infra
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
