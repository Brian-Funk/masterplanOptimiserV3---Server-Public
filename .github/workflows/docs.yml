name: Documentation

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "backend/app/**"
      - "web/src/**"
      - "web/typedoc.json"
      - "web/tsconfig.json"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: server-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:
  build-docs:
    name: Build documentation
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Prepare Next.js generated types
        working-directory: web
        run: npm run build

      - name: Generate TypeScript API docs
        working-directory: web
        run: npm run docs:typedoc

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && (github.event.repository.visibility == 'public' || !endsWith(github.repository, '-Public'))
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artefact
        if: github.event_name != 'pull_request' && (github.event.repository.visibility == 'public' || !endsWith(github.repository, '-Public'))
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-docs:
    name: Deploy documentation
    needs: build-docs
    if: github.event_name != 'pull_request' && (github.event.repository.visibility == 'public' || !endsWith(github.repository, '-Public'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
