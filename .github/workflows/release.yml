name: Signed production release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed release tag to recover, for example v3.9.0
        required: false
        type: string
      rebuild_all:
        description: Rebuild every service instead of reusing unchanged signed digests
        required: true
        default: false
        type: boolean
      active_predecessor_tag:
        description: Exact signed release currently active in production; leave empty for the latest release
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read
  checks: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify immutable release preconditions
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ! grep -Fxq "$TAG" deploy/release/retired-tags.txt
          expected_version="${TAG#v}"
          [[ "$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" == "$expected_version" ]]
          [[ "$(node -p 'require("./web/package.json").version')" == "$expected_version" ]]
          [[ "$(node -p 'require("./web/package-lock.json").version')" == "$expected_version" ]]
          [[ "$(node -p 'require("./web/package-lock.json").packages[""]?.version')" == "$expected_version" ]]
          python deploy/security/publication_audit.py --history
          python deploy/licensing/generate_third_party_notices.py --check
          git fetch origin main --quiet
          tag_commit="$(git rev-parse "$TAG^{commit}")"
          [[ "$(git rev-parse HEAD)" == "$tag_commit" ]]
          if [[ -n "$RECOVERY_TAG" ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]]
            [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
            git merge-base --is-ancestor "$tag_commit" origin/main
          else
            [[ "$GITHUB_REF" == refs/tags/v* ]]
            [[ "$tag_commit" == "$GITHUB_SHA" ]]
            [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
          fi
          existing_release_id="$(gh release view "$TAG" --json id --jq .id 2>/dev/null || true)"
          if [[ -n "$existing_release_id" && -z "$RECOVERY_TAG" ]]; then
            echo "Release $TAG already exists outside guarded recovery mode." >&2
            exit 1
          fi
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          tag_object="$(jq -er '.object.sha' <<< "$tag_ref")"
          tag_record="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          jq -e --arg commit "$tag_commit" \
            '.verification.verified == true and .object.type == "commit" and .object.sha == $commit' \
            <<< "$tag_record" >/dev/null
          check="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag_commit}/check-runs" \
            --jq '([.check_runs[] | select(.name == "server-ci-result")] | sort_by(.id) | last) // {}')"
          status="$(jq -r '.status // "missing"' <<< "$check")"
          conclusion="$(jq -r '.conclusion // "missing"' <<< "$check")"
          [[ "$status" == completed && "$conclusion" == success ]] \
            || { echo "server-ci-result is $status/$conclusion for $tag_commit" >&2; exit 1; }
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          if [[ -n "$existing_release_id" ]]; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$tag_commit" >> "$GITHUB_ENV"
      - name: Verify public source distribution
        run: |
          set -Eeuo pipefail
          repository="$(env -u GH_TOKEN -u GITHUB_TOKEN \
            curl --fail --silent --show-error \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}")"
          jq -e '.private == false and .visibility == "public"' <<< "$repository" >/dev/null \
            || { echo "The Server repository must be public before a production release is built." >&2; exit 1; }
          env -u GH_TOKEN -u GITHUB_TOKEN \
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/deploy/setup-server.sh" \
              --output /dev/null
      - name: Log in to GHCR
        if: steps.release.outputs.release_exists != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve previous signed release and component plan
        if: steps.release.outputs.release_exists != 'true'
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
          ACTIVE_PREDECESSOR_TAG: ${{ inputs.active_predecessor_tag }}
        run: |
          set -Eeuo pipefail
          latest_tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          previous_tag="${ACTIVE_PREDECESSOR_TAG:-$latest_tag}"
          if [[ -n "$ACTIVE_PREDECESSOR_TAG" ]]; then
            [[ "$ACTIVE_PREDECESSOR_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$ACTIVE_PREDECESSOR_TAG" != "$TAG" ]]
            ! grep -Fxq "$ACTIVE_PREDECESSOR_TAG" deploy/release/retired-tags.txt
            gh release view "$ACTIVE_PREDECESSOR_TAG" >/dev/null
          fi
          components='["backend","frontend","database","caddy","tools","witness","operations"]'
          previous_manifest=''
          migration_free=false
          infrastructure_unchanged=false
          if [[ "$REBUILD_ALL" != true && -n "$previous_tag" ]]; then
            mkdir -p /tmp/previous-release
            gh release download "$previous_tag" --dir /tmp/previous-release \
              --pattern release-manifest.json --pattern release-manifest.bundle
            cosign verify-blob --bundle /tmp/previous-release/release-manifest.bundle \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github\.com/Brian-Funk/masterplanOptimiserV3---Server-Public/\.github/workflows/release\.yml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/main)$' \
              /tmp/previous-release/release-manifest.json
            previous_commit="$(jq -r .commit /tmp/previous-release/release-manifest.json)"
            [[ "$previous_commit" =~ ^[0-9a-f]{40}$ ]]
            [[ "$(git rev-parse "$previous_tag^{commit}")" == "$previous_commit" ]]
            git merge-base --is-ancestor "$previous_commit" "$RELEASE_COMMIT"
            plan="$(python3 deploy/test_deployment.py classify --repo . --base "$previous_commit" --target "$RELEASE_COMMIT")"
            components="$(jq -c .components <<< "$plan")"
            if [[ "$(jq -r '.migrations == false' <<< "$plan")" == true ]] \
                && git diff --quiet "$previous_commit" "$RELEASE_COMMIT" -- \
                  deploy/migrations backend/app/models backend/app/db/database.py; then
              migration_free=true
            fi
            if git diff --quiet "$previous_commit" "$RELEASE_COMMIT" -- \
                infra/docker-compose.yml infra/docker-compose.prod.yml infra/docker-compose.ha.yml \
                infra/Dockerfile.caddy infra/Dockerfile.postgres deploy/migrations \
                backend/app/models backend/app/db/database.py; then
              infrastructure_unchanged=true
            fi
            previous_manifest=/tmp/previous-release/release-manifest.json
            jq . <<< "$plan"
          fi
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "previous_manifest=$previous_manifest" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "migration_free=$migration_free" >> "$GITHUB_OUTPUT"
          echo "infrastructure_unchanged=$infrastructure_unchanged" >> "$GITHUB_OUTPUT"
      - name: Build changed images and reuse unchanged digests
        if: steps.release.outputs.release_exists != 'true'
        id: images
        env:
          REGISTRY: ghcr.io/brian-funk/masterplanoptimiserv3---server
          COMPONENTS: ${{ steps.plan.outputs.components }}
          PREVIOUS_MANIFEST: ${{ steps.plan.outputs.previous_manifest }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
          INFRASTRUCTURE_UNCHANGED: ${{ steps.plan.outputs.infrastructure_unchanged }}
        run: |
          set -Eeuo pipefail
          for service in backend caddy postgres tools; do
            case "$service" in
              backend) component=backend; dockerfile=infra/Dockerfile ;;
              caddy) component=caddy; dockerfile=infra/Dockerfile.caddy ;;
              postgres) component=database; dockerfile=infra/Dockerfile.postgres ;;
              tools) component=tools; dockerfile=infra/Dockerfile.tools ;;
            esac
            changed="$(jq -r --arg component "$component" 'index($component) != null' <<< "$COMPONENTS")"
            if [[ "$REBUILD_ALL" != true && "$INFRASTRUCTURE_UNCHANGED" == true \
                && ( "$service" == caddy || "$service" == postgres ) ]]; then
              changed=false
            fi
            if [[ "$REBUILD_ALL" == true || "$changed" == true || -z "$PREVIOUS_MANIFEST" ]]; then
              docker buildx build --platform linux/amd64,linux/arm64 --push \
                --cache-from "type=gha,scope=release-$service" \
                --cache-to "type=gha,mode=max,scope=release-$service" \
                --metadata-file "/tmp/$service.json" -f "$dockerfile" \
                -t "$REGISTRY/$service:$TAG" .
              digest="$(jq -r '."containerimage.digest"' "/tmp/$service.json")"
              reference="$REGISTRY/$service@$digest"
              provenance=built
            else
              reference="$(jq -r --arg service "$service" '.images[$service]' "$PREVIOUS_MANIFEST")"
              [[ "$reference" =~ ^${REGISTRY}/${service}@sha256:[0-9a-f]{64}$ ]]
              docker buildx imagetools create --tag "$REGISTRY/$service:$TAG" "$reference"
              provenance=reused
            fi
            cosign sign --yes "$reference"
            printf '%s=%s\n%s_provenance=%s\n' "$service" "$reference" "$service" "$provenance" >> "$GITHUB_OUTPUT"
          done
          docker logout ghcr.io
          for service in backend caddy postgres tools; do
            reference="$(grep -m1 "^${service}=" "$GITHUB_OUTPUT" | cut -d= -f2-)"
            docker buildx imagetools inspect "$reference" >/dev/null \
              || { echo "${reference} is not anonymously readable. Make every production GHCR package public." >&2; exit 1; }
          done
      - name: Build static frontend asset
        if: steps.release.outputs.release_exists != 'true'
        working-directory: web
        env:
          MP_PUBLIC_SOURCE_REPOSITORY_URL: https://github.com/${{ github.repository }}
          MP_PUBLIC_SOURCE_REVISION: ${{ steps.release.outputs.release_commit }}
          MP_PUBLIC_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ steps.release.outputs.release_commit }}
        run: |
          python ../deploy/licensing/generate_third_party_notices.py --check
          npm ci --no-audit
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run build
      - name: Generate CycloneDX software bills of materials
        if: steps.release.outputs.release_exists != 'true'
        env:
          BACKEND: ${{ steps.images.outputs.backend }}
          CADDY: ${{ steps.images.outputs.caddy }}
          POSTGRES: ${{ steps.images.outputs.postgres }}
          TOOLS: ${{ steps.images.outputs.tools }}
        run: |
          set -Eeuo pipefail
          docker pull aquasec/trivy:0.72.0
          for service in backend caddy postgres tools; do
            case "$service" in
              backend) reference="$BACKEND" ;;
              caddy) reference="$CADDY" ;;
              postgres) reference="$POSTGRES" ;;
              tools) reference="$TOOLS" ;;
            esac
            docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.72.0 \
              image --quiet --format cyclonedx \
              --output "sbom-${service}.cdx.json" "$reference"
          done
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.72.0 \
            fs --quiet --scanners vuln --format cyclonedx \
            --skip-dirs web/node_modules \
            --skip-dirs infra/cloudflare-ha-witness/node_modules \
            --output sbom-source.cdx.json .
          for sbom in sbom-*.cdx.json; do
            jq -e '.bomFormat == "CycloneDX" and (.components | type == "array")' "$sbom" >/dev/null
          done
      - name: Create and sign release manifest
        if: steps.release.outputs.release_exists != 'true'
        env:
          BACKEND: ${{ steps.images.outputs.backend }}
          CADDY: ${{ steps.images.outputs.caddy }}
          POSTGRES: ${{ steps.images.outputs.postgres }}
          TOOLS: ${{ steps.images.outputs.tools }}
          BACKEND_PROVENANCE: ${{ steps.images.outputs.backend_provenance }}
          CADDY_PROVENANCE: ${{ steps.images.outputs.caddy_provenance }}
          POSTGRES_PROVENANCE: ${{ steps.images.outputs.postgres_provenance }}
          TOOLS_PROVENANCE: ${{ steps.images.outputs.tools_provenance }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous_tag }}
          PREVIOUS_MANIFEST: ${{ steps.plan.outputs.previous_manifest }}
          MIGRATION_FREE: ${{ steps.plan.outputs.migration_free }}
          INFRASTRUCTURE_UNCHANGED: ${{ steps.plan.outputs.infrastructure_unchanged }}
        run: |
          set -Eeuo pipefail
          mkdir -p runtime
          python3 deploy/stamp_service_worker.py web/out/sw.js "$RELEASE_COMMIT"
          python3 deploy/generate_frontend_csp.py web/out --output runtime/frontend-csp.caddy
          tar -czf web-out.tar.gz web/out runtime/frontend-csp.caddy
          tar -czf operations.tar.gz manage.sh configure-production.sh deploy infra
          cp deploy/setup-server.sh mp-opt-setup.sh
          frontend_sha="$(sha256sum web-out.tar.gz | awk '{print $1}')"
          operations_sha="$(sha256sum operations.tar.gz | awk '{print $1}')"
          bootstrap_sha="$(sha256sum mp-opt-setup.sh | awk '{print $1}')"
          sbom_source_sha="$(sha256sum sbom-source.cdx.json | awk '{print $1}')"
          sbom_backend_sha="$(sha256sum sbom-backend.cdx.json | awk '{print $1}')"
          sbom_caddy_sha="$(sha256sum sbom-caddy.cdx.json | awk '{print $1}')"
          sbom_postgres_sha="$(sha256sum sbom-postgres.cdx.json | awk '{print $1}')"
          sbom_tools_sha="$(sha256sum sbom-tools.cdx.json | awk '{print $1}')"
          blue_green_eligible=false
          if [[ "$MIGRATION_FREE" == true && "$INFRASTRUCTURE_UNCHANGED" == true \
                && -n "$PREVIOUS_MANIFEST" \
                && "$CADDY" == "$(jq -r .images.caddy "$PREVIOUS_MANIFEST")" \
                && "$POSTGRES" == "$(jq -r .images.postgres "$PREVIOUS_MANIFEST")" ]]; then
            blue_green_eligible=true
          fi
          jq -n --arg tag "$TAG" --arg commit "$RELEASE_COMMIT" \
            --arg backend "$BACKEND" --arg caddy "$CADDY" --arg postgres "$POSTGRES" --arg tools "$TOOLS" \
            --arg bp "$BACKEND_PROVENANCE" --arg cp "$CADDY_PROVENANCE" --arg pp "$POSTGRES_PROVENANCE" --arg tp "$TOOLS_PROVENANCE" \
            --arg frontend_sha "$frontend_sha" --arg operations_sha "$operations_sha" --arg bootstrap_sha "$bootstrap_sha" \
            --arg sbom_source_sha "$sbom_source_sha" --arg sbom_backend_sha "$sbom_backend_sha" \
            --arg sbom_caddy_sha "$sbom_caddy_sha" --arg sbom_postgres_sha "$sbom_postgres_sha" \
            --arg sbom_tools_sha "$sbom_tools_sha" \
            --arg previous_tag "$PREVIOUS_TAG" \
            --argjson migration_free "$MIGRATION_FREE" \
            --argjson infrastructure_unchanged "$INFRASTRUCTURE_UNCHANGED" \
            --argjson blue_green_eligible "$blue_green_eligible" \
            '{format:"mp-opt-release-v1",tag:$tag,commit:$commit,
              images:{backend:$backend,caddy:$caddy,postgres:$postgres,tools:$tools},
              component_provenance:{backend:$bp,caddy:$cp,postgres:$pp,tools:$tp},
              frontend:{asset:"web-out.tar.gz",sha256:$frontend_sha},
              operations:{asset:"operations.tar.gz",sha256:$operations_sha},
              bootstrap:{asset:"mp-opt-setup.sh",sha256:$bootstrap_sha},
              deployment:{format:"mp-opt-deployment-contract-v1",previous_tag:$previous_tag,
                migration_free:$migration_free,infrastructure_unchanged:$infrastructure_unchanged,
                blue_green_eligible:$blue_green_eligible},
              sboms:{source:{asset:"sbom-source.cdx.json",sha256:$sbom_source_sha},
                backend:{asset:"sbom-backend.cdx.json",sha256:$sbom_backend_sha},
                caddy:{asset:"sbom-caddy.cdx.json",sha256:$sbom_caddy_sha},
                postgres:{asset:"sbom-postgres.cdx.json",sha256:$sbom_postgres_sha},
                tools:{asset:"sbom-tools.cdx.json",sha256:$sbom_tools_sha}}}' > release-manifest.json
          cosign sign-blob --yes --bundle release-manifest.bundle release-manifest.json
      - name: Publish immutable GitHub Release
        if: steps.release.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "$TAG" release-manifest.json release-manifest.bundle web-out.tar.gz operations.tar.gz mp-opt-setup.sh sbom-*.cdx.json \
            --verify-tag --generate-notes --title "$TAG"
          [[ "$(gh release view "$TAG" --json name,tagName --jq '.name + " " + .tagName')" == "$TAG $TAG" ]]
      - name: Verify anonymous public release
        run: |
          set -Eeuo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          release="$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          jq -e --arg tag "$TAG" '.tag_name == $tag and .name == $tag and .draft == false and .prerelease == false' \
            <<< "$release" >/dev/null
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          for asset in release-manifest.json release-manifest.bundle web-out.tar.gz operations.tar.gz mp-opt-setup.sh \
              sbom-source.cdx.json sbom-backend.cdx.json sbom-caddy.cdx.json \
              sbom-postgres.cdx.json sbom-tools.cdx.json; do
            curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
              "${base}/${asset}" --output "${verification_dir}/${asset}"
          done
          cd "$verification_dir"
          cosign verify-blob --bundle release-manifest.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$identity" \
            release-manifest.json
          jq -e --arg tag "$TAG" --arg commit "$RELEASE_COMMIT" \
            '.format == "mp-opt-release-v1" and .tag == $tag and .commit == $commit
              and .deployment.format == "mp-opt-deployment-contract-v1"
              and (.deployment.previous_tag | type == "string")
              and (.deployment.migration_free | type == "boolean")
              and (.deployment.infrastructure_unchanged | type == "boolean")
              and (.deployment.blue_green_eligible | type == "boolean")' \
            release-manifest.json >/dev/null
          verify_asset() {
            local selector="$1" asset expected actual
            asset="$(jq -er "${selector}.asset | select(test(\"^[A-Za-z0-9.-]{1,80}$\"))" release-manifest.json)"
            expected="$(jq -er "${selector}.sha256 | select(test(\"^[0-9a-f]{64}$\"))" release-manifest.json)"
            [[ -f "$asset" ]]
            actual="$(sha256sum "$asset" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || {
              echo "SHA-256 mismatch for $asset" >&2
              exit 1
            }
          }
          verify_asset .frontend
          verify_asset .operations
          verify_asset .bootstrap
          verify_asset .sboms.source
          verify_asset .sboms.backend
          verify_asset .sboms.caddy
          verify_asset .sboms.postgres
          verify_asset .sboms.tools
          image_pattern='^ghcr\.io/brian-funk/masterplanoptimiserv3---server/(backend|caddy|postgres|tools)@sha256:[0-9a-f]{64}$'
          BACKEND="$(jq -er --arg pattern "$image_pattern" '.images.backend | select(test($pattern))' release-manifest.json)"
          CADDY="$(jq -er --arg pattern "$image_pattern" '.images.caddy | select(test($pattern))' release-manifest.json)"
          POSTGRES="$(jq -er --arg pattern "$image_pattern" '.images.postgres | select(test($pattern))' release-manifest.json)"
          TOOLS="$(jq -er --arg pattern "$image_pattern" '.images.tools | select(test($pattern))' release-manifest.json)"
          docker logout ghcr.io >/dev/null 2>&1 || true
          for reference in "$BACKEND" "$CADDY" "$POSTGRES" "$TOOLS"; do
            docker buildx imagetools inspect "$reference" >/dev/null
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "$identity" \
              "$reference" >/dev/null
          done
